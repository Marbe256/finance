<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3e; --text:#e0e0e0; --muted:#888; --accent:#4f8ef7; --green:#26a69a; --red:#ef5350; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; font-size:13px; }
  nav { display:flex; gap:4px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; }
  nav a { color:var(--muted); text-decoration:none; padding:4px 12px; border-radius:4px; }
  nav a.active, nav a:hover { background:var(--accent); color:#fff; }
  nav .title { font-weight:bold; color:var(--text); margin-right:16px; }
  .summary-bar { display:flex; gap:24px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; flex-wrap:wrap; }
  .stat { display:flex; flex-direction:column; gap:2px; }
  .stat .label { font-size:11px; color:var(--muted); }
  .stat .value { font-size:20px; font-weight:bold; }
  .stat .sub { font-size:11px; color:var(--muted); }
  .pnl-pos { color:var(--green); }
  .pnl-neg { color:var(--red); }
  .fx-rates { margin-left:auto; font-size:11px; color:var(--muted); }
  .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; }
  .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; }
  .chart-card h3 { font-size:12px; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; }
  .chart-card canvas { max-height:240px; }
  .full-width { grid-column:1/-1; }
  .period-btns { display:flex; gap:4px; margin-bottom:10px; }
  .btn { background:var(--border); border:none; color:var(--text); padding:3px 10px; border-radius:4px; cursor:pointer; font-size:11px; }
  .btn.active { background:var(--accent); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { color:var(--muted); border-bottom:1px solid var(--border); padding:4px 8px; text-align:left; font-weight:normal; }
  td { padding:4px 8px; border-bottom:1px solid var(--border); }
  @media(max-width:700px){ .charts-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<nav>
  <span class="title">📈 Finance</span>
  <a href="/">チャート</a>
  <a href="/dashboard" class="active">ダッシュボード</a>
  <a href="/screen">スクリーニング</a>
</nav>

<div class="summary-bar">
  <div class="stat">
    <span class="label">総資産（円換算）</span>
    <span class="value" id="total-value">¥--</span>
    <span class="sub" id="total-pnl">--</span>
  </div>
  <div class="stat">
    <span class="label">投資額</span>
    <span class="value" id="invested">¥--</span>
  </div>
  <div class="stat">
    <span class="label">現金</span>
    <span class="value" id="cash">¥--</span>
  </div>
  <div class="fx-rates" id="fx-rates">--</div>
</div>

<div class="charts-grid">
  <div class="chart-card">
    <h3>アセット配分</h3>
    <canvas id="donut-chart"></canvas>
  </div>
  <div class="chart-card">
    <h3>銘柄別評価損益（円）</h3>
    <canvas id="pnl-chart"></canvas>
  </div>
  <div class="chart-card full-width">
    <h3>総資産推移</h3>
    <div class="period-btns">
      <button class="btn active" onclick="loadHistory('1mo',this)">1M</button>
      <button class="btn" onclick="loadHistory('3mo',this)">3M</button>
      <button class="btn" onclick="loadHistory('6mo',this)">6M</button>
      <button class="btn" onclick="loadHistory('1y',this)">1Y</button>
    </div>
    <canvas id="history-chart"></canvas>
  </div>
  <div class="chart-card full-width">
    <h3>保有銘柄一覧</h3>
    <table>
      <thead><tr><th>銘柄</th><th>種別</th><th>数量</th><th>現在値(円)</th><th>評価額(円)</th><th>損益</th><th>配分%</th></tr></thead>
      <tbody id="positions-table"></tbody>
    </table>
  </div>
</div>

<script>
const TYPE_COLORS = { stock:'#4f8ef7', crypto:'#f7c948', commodity:'#e97150', forex:'#26a69a', cash:'#888' };
let donutChart, pnlChart, historyChart;

async function loadSummary() {
  const res = await fetch('/api/portfolio/summary');
  if (!res.ok) return;
  const data = await res.json();

  document.getElementById('total-value').textContent = '¥' + data.total_value_jpy.toLocaleString();
  const pnl = data.total_pnl_jpy;
  const pnlEl = document.getElementById('total-pnl');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + '¥' + pnl.toLocaleString();
  pnlEl.className = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
  document.getElementById('invested').textContent = '¥' + data.invested_jpy.toLocaleString();
  document.getElementById('cash').textContent = '¥' + data.cash_jpy.toLocaleString();

  const rates = data.fx_rates || {};
  document.getElementById('fx-rates').textContent = Object.entries(rates).map(([k,v]) => `${k}: ${v.toLocaleString()}`).join('　');

  renderDonut(data.by_type);
  renderPnlChart(data.by_position || []);
  renderPositionsTable(data.by_position || [], data.total_value_jpy);
}

function renderDonut(byType) {
  const labels = byType.map(t => t.type);
  const values = byType.map(t => t.value_jpy);
  const colors = labels.map(l => TYPE_COLORS[l] || '#aaa');
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(document.getElementById('donut-chart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#0f1117', borderWidth: 2 }] },
    options: {
      plugins: {
        legend: { labels: { color: '#e0e0e0', font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => `${ctx.label}: ¥${ctx.raw.toLocaleString()} (${byType[ctx.dataIndex].pct}%)` } }
      }
    }
  });
}

function renderPnlChart(positions) {
  const labels = positions.map(p => p.symbol);
  const values = positions.map(p => p.unrealized_pnl);
  const colors = values.map(v => v >= 0 ? '#26a69a' : '#ef5350');
  if (pnlChart) pnlChart.destroy();
  pnlChart = new Chart(document.getElementById('pnl-chart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 3 }] },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `¥${ctx.raw.toLocaleString()}` } } },
      scales: { x: { ticks: { color: '#888' }, grid: { color: '#1e2130' } }, y: { ticks: { color: '#e0e0e0' }, grid: { color: '#1e2130' } } }
    }
  });
}

async function loadHistory(period, btn) {
  document.querySelectorAll('.period-btns .btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const res = await fetch(`/api/portfolio/history?period=${period}`);
  if (!res.ok) return;
  const data = await res.json();
  renderHistory(data.history);
}

function renderHistory(history) {
  const labels = history.map(h => h.date);
  const types = ['stock', 'crypto', 'commodity', 'forex', 'cash'];
  const datasets = types.map(t => ({
    label: t,
    data: history.map(h => h.by_type[t] || 0),
    backgroundColor: TYPE_COLORS[t] + 'aa',
    borderColor: TYPE_COLORS[t],
    borderWidth: 1,
    fill: true,
  }));
  if (historyChart) historyChart.destroy();
  historyChart = new Chart(document.getElementById('history-chart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      plugins: { legend: { labels: { color: '#e0e0e0', font: { size: 11 } } } },
      scales: {
        x: { stacked: true, ticks: { color: '#888', maxTicksLimit: 10 }, grid: { color: '#1e2130' } },
        y: { stacked: true, ticks: { color: '#888', callback: v => '¥' + v.toLocaleString() }, grid: { color: '#1e2130' } }
      }
    }
  });
}

function renderPositionsTable(positions, total) {
  const tbody = document.getElementById('positions-table');
  tbody.innerHTML = '';
  positions.forEach(p => {
    const pnl = p.unrealized_pnl;
    const cls = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
    const pct = total > 0 ? (p.market_value_jpy / total * 100).toFixed(1) : 0;
    tbody.innerHTML += `<tr>
      <td>${p.symbol}</td><td>${p.type}</td><td>${p.quantity}</td>
      <td>¥${(p.market_value_jpy / p.quantity).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',')}</td>
      <td>¥${p.market_value_jpy.toLocaleString()}</td>
      <td class="${cls}">${pnl >= 0 ? '+' : ''}¥${pnl.toLocaleString()}</td>
      <td>${pct}%</td>
    </tr>`;
  });
}

loadSummary();
loadHistory('1mo', document.querySelector('.period-btns .btn.active'));
setInterval(loadSummary, 60000);
</script>
</body>
</html>
