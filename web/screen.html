<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクリーニング</title>
<style>
  :root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3e; --text:#e0e0e0; --muted:#888; --accent:#4f8ef7; --green:#26a69a; --red:#ef5350; --yellow:#ffc107; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; font-size:13px; }
  nav { display:flex; gap:4px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; }
  nav a { color:var(--muted); text-decoration:none; padding:4px 12px; border-radius:4px; }
  nav a.active, nav a:hover { background:var(--accent); color:#fff; }
  nav .title { font-weight:bold; color:var(--text); margin-right:16px; }
  .layout { display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100vh - 44px); }
  .sidebar { background:var(--surface); border-right:1px solid var(--border); padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
  .section h4 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .check-group { display:flex; flex-direction:column; gap:4px; }
  .check-group label { display:flex; gap:6px; align-items:center; cursor:pointer; padding:3px 0; }
  .check-group label:hover { color:var(--accent); }
  .filter-list { display:flex; flex-direction:column; gap:4px; }
  .filter-item { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:5px 8px; display:flex; justify-content:space-between; align-items:center; font-size:12px; }
  .filter-item .remove { color:var(--red); cursor:pointer; font-size:14px; }
  .filter-add { display:flex; gap:4px; }
  .filter-add select { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:4px 6px; border-radius:4px; font-size:12px; }
  .btn { background:var(--border); border:none; color:var(--text); padding:5px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
  .btn:hover { background:var(--accent); color:#fff; }
  .btn.primary { background:var(--accent); color:#fff; width:100%; padding:8px; font-size:13px; }
  .btn.primary:hover { opacity:0.9; }
  .main { display:flex; flex-direction:column; overflow:hidden; }
  .result-header { padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  .result-header .count { color:var(--muted); font-size:12px; }
  .result-header .count strong { color:var(--text); }
  #loading { display:none; color:var(--accent); font-size:12px; }
  .result-table-wrap { flex:1; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; }
  th { color:var(--muted); border-bottom:1px solid var(--border); padding:6px 10px; text-align:left; font-weight:normal; font-size:11px; position:sticky; top:0; background:var(--surface); }
  td { padding:6px 10px; border-bottom:1px solid var(--border); }
  tr:hover td { background:var(--surface); cursor:pointer; }
  .score-bar { display:flex; align-items:center; gap:6px; }
  .score-fill { height:6px; border-radius:3px; background:var(--accent); min-width:2px; }
  .badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; }
  .badge-stock { background:#4f8ef722; color:#4f8ef7; }
  .badge-crypto { background:#f7c94822; color:#f7c948; }
  .badge-commodity { background:#e9715022; color:#e97150; }
  .badge-forex { background:#26a69a22; color:#26a69a; }
  .sig-bull { color:var(--green); }
  .sig-bear { color:var(--red); }
  .sig-neu { color:var(--muted); }
  @media(max-width:700px){ .layout{grid-template-columns:1fr} .sidebar{display:none} }
</style>
</head>
<body>
<nav>
  <span class="title">📈 Finance</span>
  <a href="/">チャート</a>
  <a href="/dashboard">ダッシュボード</a>
  <a href="/screen" class="active">スクリーニング</a>
</nav>

<div class="layout">
  <div class="sidebar">
    <div class="section">
      <h4>母集団</h4>
      <div class="check-group">
        <label><input type="checkbox" value="watchlist"> ウォッチリスト</label>
        <label><input type="checkbox" value="nikkei225_sample" checked> 日経225（サンプル）</label>
        <label><input type="checkbox" value="sp500_sample" checked> S&P500（サンプル）</label>
        <label><input type="checkbox" value="crypto"> 仮想通貨</label>
        <label><input type="checkbox" value="commodity"> コモディティ</label>
        <label><input type="checkbox" value="forex"> 為替</label>
      </div>
    </div>

    <div class="section">
      <h4>フィルター条件</h4>
      <div class="filter-list" id="filter-list"></div>
      <div class="filter-add" style="margin-top:6px">
        <select id="filter-preset">
          <option value="">-- 条件を追加 --</option>
          <optgroup label="RSI">
            <option value='{"type":"rsi","condition":"lt","value":40}'>RSI &lt; 40（売られすぎ）</option>
            <option value='{"type":"rsi","condition":"gt","value":60}'>RSI &gt; 60（買われすぎ）</option>
          </optgroup>
          <optgroup label="MACD">
            <option value='{"type":"macd","condition":"bullish_cross"}'>MACDゴールデンクロス</option>
            <option value='{"type":"macd","condition":"bearish_cross"}'>MACDデッドクロス</option>
          </optgroup>
          <optgroup label="一目均衡表">
            <option value='{"type":"price_above_cloud"}'>雲の上</option>
            <option value='{"type":"price_below_cloud"}'>雲の下</option>
          </optgroup>
          <optgroup label="ボリンジャーバンド">
            <option value='{"type":"bbands","condition":"near_lower"}'>BB下限付近</option>
            <option value='{"type":"bbands","condition":"near_upper"}'>BB上限付近</option>
          </optgroup>
          <optgroup label="出来高">
            <option value='{"type":"volume_surge","value":1.5}'>出来高急増（1.5倍）</option>
            <option value='{"type":"volume_surge","value":2}'>出来高急増（2倍）</option>
          </optgroup>
          <optgroup label="SMAクロス">
            <option value='{"type":"sma_cross","condition":"golden"}'>SMAゴールデンクロス</option>
            <option value='{"type":"sma_cross","condition":"dead"}'>SMAデッドクロス</option>
          </optgroup>
        </select>
        <button class="btn" onclick="addFilter()">追加</button>
      </div>
    </div>

    <div class="section">
      <h4>並び順</h4>
      <select id="sort-by" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px">
        <option value="score">スコア順</option>
        <option value="rsi">RSI順</option>
        <option value="volume_surge">出来高急増率</option>
      </select>
    </div>

    <button class="btn primary" onclick="runScreen()">🔍 スキャン実行</button>
  </div>

  <div class="main">
    <div class="result-header">
      <span class="count" id="result-count">スキャン待機中</span>
      <span id="loading">⏳ スキャン中...</span>
    </div>
    <div class="result-table-wrap">
      <table>
        <thead>
          <tr>
            <th>銘柄</th><th>種別</th><th>スコア</th><th>価格</th>
            <th>RSI</th><th>MACD</th><th>一目</th><th>HV</th><th>出来高比</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let filters = [];

function addFilter() {
  const sel = document.getElementById('filter-preset');
  if (!sel.value) return;
  try {
    const f = JSON.parse(sel.value);
    filters.push(f);
    renderFilters();
    sel.value = '';
  } catch(e) {}
}

function renderFilters() {
  const list = document.getElementById('filter-list');
  list.innerHTML = '';
  filters.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'filter-item';
    div.innerHTML = `<span>${filterLabel(f)}</span><span class="remove" onclick="removeFilter(${i})">×</span>`;
    list.appendChild(div);
  });
}

function filterLabel(f) {
  if (f.type === 'rsi') return `RSI ${f.condition === 'lt' ? '<' : '>'} ${f.value}`;
  if (f.type === 'macd') return f.condition === 'bullish_cross' ? 'MACDゴールデンクロス' : 'MACDデッドクロス';
  if (f.type === 'price_above_cloud') return '雲の上';
  if (f.type === 'price_below_cloud') return '雲の下';
  if (f.type === 'bbands') return `BB${f.condition === 'near_lower' ? '下限' : '上限'}付近`;
  if (f.type === 'volume_surge') return `出来高急増 ${f.value}倍`;
  if (f.type === 'sma_cross') return f.condition === 'golden' ? 'SMAゴールデンクロス' : 'SMAデッドクロス';
  return JSON.stringify(f);
}

function removeFilter(i) {
  filters.splice(i, 1);
  renderFilters();
}

async function runScreen() {
  const universe = [...document.querySelectorAll('.check-group input:checked')].map(el => el.value);
  if (!universe.length) { alert('母集団を選択してください'); return; }
  const sort_by = document.getElementById('sort-by').value;

  document.getElementById('loading').style.display = '';
  document.getElementById('result-count').textContent = 'スキャン中...';

  const res = await fetch('/api/screen', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ universe, filters, sort_by, limit: 30 }),
  });
  document.getElementById('loading').style.display = 'none';
  if (!res.ok) { alert('スキャン失敗'); return; }
  const data = await res.json();
  document.getElementById('result-count').innerHTML = `スキャン: <strong>${data.scanned}</strong>件 / マッチ: <strong>${data.matched}</strong>件`;
  renderResults(data.results);
}

function renderResults(results) {
  const tbody = document.getElementById('result-body');
  tbody.innerHTML = '';
  results.forEach(r => {
    const s = r.signals;
    const macdCls = s.macd === 'bullish' ? 'sig-bull' : 'sig-bear';
    const ichiCls = s.ichimoku === 'above_cloud' ? 'sig-bull' : 'sig-bear';
    const rsiCls = s.rsi < 35 ? 'sig-bull' : s.rsi > 65 ? 'sig-bear' : 'sig-neu';
    const badge = `<span class="badge badge-${r.type}">${r.type}</span>`;
    tbody.innerHTML += `<tr onclick="goChart('${r.symbol}')">
      <td><strong>${r.symbol}</strong></td>
      <td>${badge}</td>
      <td><div class="score-bar"><div class="score-fill" style="width:${r.score*80}px"></div>${r.score.toFixed(2)}</div></td>
      <td>${r.price.toLocaleString()}</td>
      <td class="${rsiCls}">${s.rsi ?? '--'}</td>
      <td class="${macdCls}">${s.macd ?? '--'}</td>
      <td class="${ichiCls}">${s.ichimoku ?? '--'}</td>
      <td>${s.hv ?? '--'}%</td>
      <td>${s.volume_surge ? s.volume_surge + 'x' : '--'}</td>
      <td><button class="btn" onclick="event.stopPropagation();addWatch('${r.symbol}')">+Watch</button></td>
    </tr>`;
  });
}

function goChart(symbol) {
  location.href = `/?symbol=${encodeURIComponent(symbol)}`;
}

async function addWatch(symbol) {
  await fetch('/api/watchlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol }) });
  alert(`${symbol} をウォッチリストに追加しました`);
}
</script>
</body>
</html>
